; Cấu hình kết nối database cho công cụ ghép khóa.
; Sửa trực tiếp file này khi đổi máy chủ/mật khẩu — không cần sửa code Python.
; Đăng nhập Windows (máy cùng domain, ví dụ máy đặt SQL Server ngay tại chỗ)
; thì để trống nguoi_dung và mat_khau. Đăng nhập SQL (máy chủ khác mạng/domain,
; như máy chủ CHITHANH của Trường) thì điền đủ nguoi_dung + mat_khau.

[trung_tam]
; GPLX_KhaoSat — hồ sơ học viên khóa cũ của Trung tâm (mã cơ sở 92004).
; Chỉ đọc, không có hàm ghi nào trỏ tới đây.
may_chu = CHITHANH\SQLEXPRESS
csdl = GPLX_CSDT
nguoi_dung = sa
mat_khau = 123456

[truong]
; Máy chủ tên "cdtd" (không phải CHITHANH — đó là máy chủ khác, chỉ có dữ
; liệu Trung tâm dự phòng), database GPLX_CSDT (484 khóa, mã cơ sở 92001) —
; đã xác nhận có thật bằng cách dò đúng học viên NGUYỄN NHỰT THẮNG khóa
; C1K54. Nằm trong mạng nội bộ của Trường — chỉ kết nối được khi máy chạy
; web/Python đang ở trong mạng đó. Chỉ đọc, không có hàm ghi nào trỏ tới
; đây; nếu không vào được mạng thì tự động dùng dữ liệu dự phòng đã nạp sẵn
; trong DrivingManagement (xem [web] bên dưới), không văng lỗi.
may_chu = cdtd
csdl = GPLX_CSDT
nguoi_dung = sa
mat_khau = 123456

